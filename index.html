<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Franja de Recocha</title><style>

:root{--bg:#101120;--card:#1a1d32;--text:#fffaf2;--muted:#b9bfd3;--accent:#ff9f43;--accent2:#8e7dff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 90% 5%,#8e7dff33,transparent 28%),radial-gradient(circle at 10% 0%,#ff9f432b,transparent 30%),var(--bg);color:var(--text)}
main{max-width:720px;margin:auto;padding:20px 18px 70px}
.top{position:sticky;top:0;padding:12px 0;background:linear-gradient(var(--bg) 70%,transparent);z-index:3}
.track{height:9px;background:#ffffff14;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}
.screen{display:none}.screen.active{display:block}
.hero{padding:32px 0 18px}
.kicker{display:inline-block;padding:8px 12px;border-radius:999px;background:#ffffff10;border:1px solid #ffffff1c;font-size:14px}
h1{font-size:clamp(42px,12vw,70px);line-height:.92;margin:18px 0 12px}
h2{font-size:32px;line-height:1.05}
.lead,.muted{color:var(--muted)}.lead{font-size:19px}
.group,.card{background:linear-gradient(145deg,#272a49,#17192e);border:1px solid #ffffff1c;border-radius:24px;padding:22px;margin:16px 0}
.card{background:var(--card)}
.num{font-size:86px;font-weight:900;color:var(--accent);line-height:.9}
input,textarea{width:100%;background:#0f1122;color:white;border:1px solid #ffffff22;border-radius:14px;padding:14px;font:inherit;margin-top:8px}
textarea{min-height:90px}
label{display:block;font-weight:700;margin-top:15px}
.actions{display:flex;gap:10px;margin-top:24px}
button,a.btn{border:0;border-radius:16px;padding:15px 18px;font:inherit;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}
.primary{background:var(--accent);color:#201407;flex:1}
.secondary{background:#ffffff0d;color:white;border:1px solid #ffffff20}
.notice{padding:15px 17px;border-radius:16px;background:#ff9f4315;border-left:4px solid var(--accent);color:#e9e1d8}
.song{display:flex;gap:14px;align-items:center;padding:18px;background:#20233c;border-radius:18px}
.footer{text-align:center;color:#7f859c;font-size:12px;margin-top:35px}
.symbol-row{display:flex;gap:14px;align-items:flex-start}.symbol-emoji{font-size:38px;line-height:1}

.card{display:block;text-decoration:none;color:white}.card strong{font-size:25px}.card span{display:block;color:var(--muted);margin-top:6px}
</style></head><body><main><div class="hero"><span class="kicker">🎟️ La Gran Despedida</span><h1>Franja de Recocha</h1><p class="lead">Selecciona el número asignado a tu equipo.</p></div><a class="card" href="grupo-1.html"><strong>Grupo 1</strong><span>Abrir experiencia</span></a><a class="card" href="grupo-2.html"><strong>Grupo 2</strong><span>Abrir experiencia</span></a><a class="card" href="grupo-3.html"><strong>Grupo 3</strong><span>Abrir experiencia</span></a><a class="card" href="grupo-4.html"><strong>Grupo 4</strong><span>Abrir experiencia</span></a><a class="card" href="grupo-5.html"><strong>Grupo 5</strong><span>Abrir experiencia</span></a></main></body></html>
